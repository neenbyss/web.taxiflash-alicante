services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taxiflash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxiflash_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-taxiflash}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - taxiflash_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxiflash} -d ${POSTGRES_DB:-taxiflash}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  migrate:
    build:
      context: .
      target: builder
    command: sh -c "yarn prisma migrate deploy && yarn tsx prisma/seed.ts"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taxiflash}:${POSTGRES_PASSWORD:-taxiflash_dev_password}@db:5432/${POSTGRES_DB:-taxiflash}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@taxiflash.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?define BETTER_AUTH_SECRET en .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3500}
      TRUSTED_PROXY_HEADER: ${TRUSTED_PROXY_HEADER:-x-real-ip}
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "3500:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taxiflash}:${POSTGRES_PASSWORD:-taxiflash_dev_password}@db:5432/${POSTGRES_DB:-taxiflash}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?define BETTER_AUTH_SECRET en .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3500}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3500}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST_DOCKER:-mailpit}
      SMTP_PORT: ${SMTP_PORT_DOCKER:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      EMAIL_FROM: ${EMAIL_FROM:-TaxiFlash <no-reply@taxiflash.local>}
      TARIFA_BASE: ${TARIFA_BASE:-2.50}
      TARIFA_POR_KM: ${TARIFA_POR_KM:-1.20}
      TARIFA_MINIMA: ${TARIFA_MINIMA:-4.00}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  taxiflash_pgdata:
